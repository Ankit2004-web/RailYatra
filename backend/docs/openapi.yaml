openapi: 3.0.3
info:
  title: RailYatra API
  version: 2.0.0
  description: |
    Node.js + SQL Server API for RailYatra train booking and reservation management.
    Master timetable data (Category A) is imported from authorized datasets.
    Fares, availability, RAC/WL (Category B) are development simulations unless noted.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: OK
  /stations/search:
    get:
      summary: Station autocomplete
      tags: [Stations]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ranked station list (max 20)
  /trains/search:
    get:
      summary: Train between stations (stop-graph search)
      tags: [Trains]
      parameters:
        - { name: from, in: query, schema: { type: string }, description: Station code or name }
        - { name: to, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: class, in: query, schema: { type: string } }
        - { name: quota, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching trains with segment times and day offsets
  /trains/autocomplete:
    get:
      summary: Train number/name search
      tags: [Trains]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Train suggestions
  /trains/{id}:
    get:
      summary: Train details (summary, no full route)
      tags: [Trains]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Train summary with classes and running days
        '404':
          description: Not found
  /trains/{id}/route:
    get:
      summary: Ordered train route with day offsets
      tags: [Trains]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Stops sorted by stopSequence
  /fares/estimate:
    get:
      summary: Development fare estimate (NOT official IR fares)
      tags: [Fares]
      parameters:
        - { name: trainId, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: class, in: query, required: true, schema: { type: string } }
        - { name: quota, in: query, schema: { type: string } }
        - { name: passengers, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Simulated fare breakdown
  /availability/check:
    get:
      summary: Development availability check (NOT official IRCTC inventory)
      tags: [Availability]
      parameters:
        - { name: trainId, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: class, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Simulated availability status
  /bookings/pnr/{pnr}:
    get:
      summary: PNR status lookup
      tags: [Bookings]
      parameters:
        - { name: pnr, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Booking and passenger status (PII limited)
        '404':
          description: PNR not found
  /bookings/{id}/pending:
    delete:
      summary: Remove unpaid pending booking
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pending booking removed
  /passengers/saved:
    get:
      summary: List saved passengers for current user
      tags: [Passengers]
      security: [{ AuthToken: [] }]
      responses:
        '200':
          description: Saved passenger list
    post:
      summary: Add saved passenger
      tags: [Passengers]
      security: [{ AuthToken: [] }]
      responses:
        '201':
          description: Saved passenger created
  /passengers/saved/{id}:
    put:
      summary: Update saved passenger
      tags: [Passengers]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated passenger
    delete:
      summary: Delete saved passenger
      tags: [Passengers]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Passenger removed
  /payments/create-order:
    post:
      summary: Create Razorpay order for booking payment
      tags: [Payments]
      security: [{ AuthToken: [] }]
      responses:
        '200':
          description: Payment order details
  /payments/verify:
    post:
      summary: Verify Razorpay payment signature
      tags: [Payments]
      security: [{ AuthToken: [] }]
      responses:
        '200':
          description: Payment confirmed
  /payments/dev-confirm:
    post:
      summary: Simulate payment (dev mode only)
      tags: [Payments]
      security: [{ AuthToken: [] }]
      responses:
        '200':
          description: Payment simulated
  /trains/{id}/seats:
    get:
      summary: Seat map with availability flags
      tags: [Trains]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: classCode, in: query, required: true, schema: { type: string } }
        - { name: journeyDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Seat map with isAvailable and isBooked flags
  /admin/rac/promote:
    post:
      summary: Promote next paid RAC booking to confirmed
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200':
          description: RAC booking promoted
  /admin/data-import/status:
    get:
      summary: Master data import provenance and counts
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200':
          description: Latest imports and master-data counts
  /admin/trains:
    get:
      summary: Paginated admin train list
      tags: [Admin]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated trains
  /admin/stations:
    get:
      summary: Paginated admin station list
      tags: [Admin]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated stations
  /auth/register:
    post:
      summary: Register passenger account
      tags: [Auth]
      responses:
        '200': { description: JWT token issued }
  /auth/login:
    post:
      summary: Login with captcha
      tags: [Auth]
      responses:
        '200': { description: JWT token issued }
  /auth/me:
    get:
      summary: Current user profile
      tags: [Auth]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: User profile }
  /auth/profile:
    put:
      summary: Update name and phone
      tags: [Auth]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Updated profile }
  /auth/change-password:
    put:
      summary: Change password
      tags: [Auth]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Password updated }
  /auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Auth]
      responses:
        '200': { description: Reset email sent if account exists }
  /auth/reset-password:
    post:
      summary: Complete password reset
      tags: [Auth]
      responses:
        '200': { description: Password reset complete }
  /captcha:
    get:
      summary: Math captcha challenge
      tags: [Auth]
      responses:
        '200': { description: captchaId and question }
  /stations:
    get:
      summary: List all stations
      tags: [Stations]
      responses:
        '200': { description: Station list }
  /trains:
    get:
      summary: List all trains
      tags: [Trains]
      responses:
        '200': { description: Train list }
    post:
      summary: Create train (admin)
      tags: [Trains, Admin]
      security: [{ AuthToken: [] }]
      responses:
        '201': { description: Train created }
  /bookings:
    get:
      summary: Current user bookings
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Booking list }
    post:
      summary: Create booking
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      responses:
        '201': { description: Booking created }
  /bookings/{id}:
    get:
      summary: Booking detail
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Booking detail }
    put:
      summary: Update booking status (cancel)
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Updated booking with refund preview }
  /bookings/{id}/ticket:
    get:
      summary: Download e-ticket PDF
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: PDF ticket }
  /bookings/{id}/refund-preview:
    get:
      summary: Cancellation refund estimate
      tags: [Bookings]
      security: [{ AuthToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Refund breakdown }
  /payments/config:
    get:
      summary: Razorpay public config
      tags: [Payments]
      responses:
        '200': { description: devMode and keyId }
  /payments/webhook:
    post:
      summary: Razorpay webhook receiver
      tags: [Payments]
      responses:
        '200': { description: Event processed }
        '400': { description: Invalid signature }
        '503': { description: Webhook secret not configured }
  /admin/dashboard:
    get:
      summary: Admin dashboard stats
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Dashboard metrics }
  /admin/bookings:
    get:
      summary: Filtered admin booking list
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Bookings }
  /admin/users:
    get:
      summary: Admin user list
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Users }
  /admin/waitlist/promote:
    post:
      summary: Promote next waitlisted booking
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Waitlist promoted }
  /admin/reports/revenue:
    get:
      summary: Revenue report
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Revenue by date }
  /admin/reports/occupancy:
    get:
      summary: Train occupancy report
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Occupancy rows }
  /admin/reports/cancellations:
    get:
      summary: Cancellation report
      tags: [Admin]
      security: [{ AuthToken: [] }]
      responses:
        '200': { description: Cancellations by date }
  /docs:
    get:
      summary: API documentation index
      tags: [System]
      responses:
        '200': { description: Documentation links }
  /swagger:
    get:
      summary: Swagger UI
      tags: [System]
      responses:
        '200': { description: HTML Swagger UI }
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: x-auth-token
