# Render Blueprint — RailYatra
# Note: Requires external SQL Server (Azure SQL recommended).
# LocalDB / msnodesqlv8 is Windows-only; use Azure App Service for easiest SQL Server hosting.
#
# Docs: docs/DEPLOY.md

services:
  - type: web
    name: railyatra
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run frontend:build
    startCommand: node backend/scripts/start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_TRUSTED_CONNECTION
        value: false
      - key: DB_NAME
        value: RailwayReservation
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SERVER
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
