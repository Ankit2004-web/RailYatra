# Render Blueprint — RailYatra (100% FREE — no credit card for database)
# Connect at https://dashboard.render.com → New → Blueprint → select this repo

services:
  - type: web
    name: railyatra
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run frontend:build
    startCommand: node backend/server.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/railyatra.db
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@railway.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
