# Render Blueprint — RailYatra (100% FREE — no credit card for database)

services:
  - type: web
    name: railyatra
    runtime: node
    plan: free
    region: singapore
    buildCommand: NPM_CONFIG_PRODUCTION=false npm run install:all && npm run frontend:build && node backend/scripts/verify-master-db.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/railyatra-runtime.db
      - key: SQLITE_MASTER_PATH
        value: backend/data/railyatra-master.db
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@railway.com
      - key: ADMIN_PASSWORD
        value: "Adm!n@2004#Hyd"
      - key: ALLOW_DEV_PAYMENT
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: WEB3FORMS_ACCESS_KEY
        value: f8d13fbf-80b4-4dbc-bab1-e6b5c38d84f8
      - key: WEB3FORMS_FROM_NAME
        value: RailYatra
      - key: VITE_WEB3FORMS_ACCESS_KEY
        value: f8d13fbf-80b4-4dbc-bab1-e6b5c38d84f8
      - key: VITE_WEB3FORMS_FROM_NAME
        value: RailYatra
      - key: GOOGLE_CLIENT_ID
        value: 104584032070-4fi354ul520vcnauol3s5go17hpd7oca.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 104584032070-4fi354ul520vcnauol3s5go17hpd7oca.apps.googleusercontent.com
